
name: Auto Delete HTML Files

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete only HTML files
        run: |
          find article -maxdepth 1 -type f \
            -iname "*.html" \
            ! -iname "index.html" \
            -delete

          git add -u -- article/

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Delete HTML files automatically"
            git push
          fi
