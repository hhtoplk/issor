
name: Delete Uploads HTML Files

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm deletion (all HTML except index.html)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  delete-html:
    if: github.ref == 'refs/heads/main' && inputs.confirm == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete HTML files only
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          # Target folder
          folder = Path("uploads")

          if not folder.is_dir():
              raise SystemExit("ERROR: uploads folder not found")

          deleted = []

          # Check only direct files inside uploads
          for file in folder.iterdir():

              # Ignore folders and symbolic links
              if not file.is_file() or file.is_symlink():
                  continue

              # Always preserve index.html
              if file.name.lower() == "index.html":
                  print(f"KEEP: {file}")
                  continue

              # Only HTML extensions are eligible
              if file.suffix.lower() != ".html":
                  print(f"KEEP: {file}")
                  continue

              # Delete eligible HTML files
              subprocess.run(
                  ["git", "rm", "--", file.as_posix()],
                  check=True
              )

              deleted.append(file.name)

          print("\n========== DELETE REPORT ==========")
          print(f"Folder: {folder}")
          print(f"Total HTML files deleted: {len(deleted)}")

          for name in deleted:
              print(f"DELETED: {name}")

          print("===================================")
          PY

      - name: Commit deletions
        run: |
          if git diff --cached --quiet; then
            echo "No eligible HTML files found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Delete HTML files from uploads folder"
          git push
