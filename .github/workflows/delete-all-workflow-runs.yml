
name: Delete All Workflow Runs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm deletion of all completed workflow runs"
        required: true
        type: boolean
        default: false

permissions:
  actions: write

jobs:
  delete-runs:
    if: github.ref == 'refs/heads/main' && inputs.confirm == true
    runs-on: ubuntu-latest

    steps:
      - name: Collect all completed workflow runs
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import time

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current = int(os.environ["CURRENT_RUN_ID"])

          base = f"https://api.github.com/repos/{repo}/actions/runs"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          run_ids = []
          page = 1

          print("Collecting workflow runs...")

          while True:
              url = f"{base}?per_page=100&page={page}"

              req = urllib.request.Request(url, headers=headers)

              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      data = json.loads(response.read())

              except Exception as error:
                  raise SystemExit(
                      f"ERROR collecting page {page}: {error}"
                  )

              runs = data.get("workflow_runs", [])

              if not runs:
                  break

              for run in runs:
                  if run["id"] == current:
                      continue

                  if run["status"] != "completed":
                      continue

                  run_ids.append(run["id"])

              print(f"Page {page}: {len(runs)} runs checked")

              if len(runs) < 100:
                  break

              page += 1

          print("--------------------------------")
          print(f"Total completed runs found: {len(run_ids)}")

          with open("/tmp/run_ids.json", "w") as file:
              json.dump(run_ids, file)

          print("All Run IDs collected successfully.")
          PY

      - name: Delete all collected workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import time

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          base = f"https://api.github.com/repos/{repo}/actions/runs"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          with open("/tmp/run_ids.json") as file:
              run_ids = json.load(file)

          deleted = 0
          failed = []

          print("Starting workflow run deletion...")
          print(f"Runs to delete: {len(run_ids)}")
          print("--------------------------------")

          for index, run_id in enumerate(run_ids, start=1):

              url = f"{base}/{run_id}"

              req = urllib.request.Request(
                  url,
                  headers=headers,
                  method="DELETE"
              )

              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      if response.status == 204:
                          deleted += 1
                          print(
                              f"[{index}/{len(run_ids)}] "
                              f"Deleted: {run_id}"
                          )
                      else:
                          failed.append((run_id, response.status))
                          print(
                              f"Failed: {run_id} "
                              f"Status: {response.status}"
                          )

              except urllib.error.HTTPError as error:
                  failed.append((run_id, error.code))
                  print(
                      f"Failed: {run_id} "
                      f"HTTP: {error.code}"
                  )

              except Exception as error:
                  failed.append((run_id, str(error)))
                  print(f"Failed: {run_id} Error: {error}")

              time.sleep(0.1)

          print("--------------------------------")
          print(f"Total found: {len(run_ids)}")
          print(f"Successfully deleted: {deleted}")
          print(f"Failed: {len(failed)}")

          if failed:
              print("Failed Run IDs:")
              for run_id, reason in failed:
                  print(f"{run_id}: {reason}")

              raise SystemExit(
                  "ERROR: Some workflow runs could not be deleted."
              )

          print("SUCCESS: All collected completed runs deleted.")
          PY
